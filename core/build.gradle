// Modified for the AI SDLC browser game fork (goofmint/Mindustry-Classic) by Atsushi Nakatsugawa, 2026. See LICENSE (GPL-3.0).
apply plugin: "java"
sourceCompatibility = 1.8
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceSets.main.java.srcDirs = ["src/"]
sourceSets.main.java.exclude 'test/**'
sourceSets.test.java.srcDirs = ["src/test/java"]

dependencies {
	testImplementation 'junit:junit:4.13.2'
}

test {
	useJUnit()
}

import com.badlogic.gdx.tools.texturepacker.TexturePacker

task pack(){
	doLast{
		TexturePacker.process("core/assets-raw/sprites/", "core/assets/sprites/", "sprites.atlas")
	}
}

//desktop の genIcons と一緒に実行したとき、生成したアイコンをパックに含める
pack.mustRunAfter ':desktop:genIcons'
