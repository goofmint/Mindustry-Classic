text.tutorial.title=Tutorial ({0}/{1})
text.tutorial.prompt=First time here?\nThe tutorial walks you through the first move on the Prototype map.
text.tutorial.next=Next
text.tutorial.skip=Skip
text.tutorial.close=Close
tutorial.goal=[accent]Goal:[] raise the balance from {1} to the target of {0}.\nProduction pays quality x importance credits for each delivery. Low-quality code costs credits, so the starting base alone loses money.
tutorial.pipeline=The base is a production line: [accent]human engineers[] write code, the [accent]unit test[] raises its quality one stage, and [accent]production[] (the core) pays for what arrives. All three are highlighted.
tutorial.break=The highlighted [accent]pipeline[] is where all code merges before the test. Press [accent]{0}[] on it to remove it. You can build while paused.
tutorial.break.hint=While a block is selected, {0} only deselects it.
tutorial.select=Open the crafting tab (the icon tab in the bottom-right panel) and select [accent]CodeRabbit[] ({0} credits).
tutorial.place=Press [accent]{0}[] on the highlighted tile to place CodeRabbit. It reviews every piece of code, raising its quality by two stages before the test.
tutorial.unpause=Press [accent]{0}[] to unpause. The local GPU's laser now powers CodeRabbit. The first positive delivery to production completes this step; the balance moves once the fractions add up.
tutorial.done=Reach the target to win. Lose if a delivery drops the balance below zero or production is destroyed. Bugs come in timed waves. Block details: hold [accent]{0}[] and press [accent]{1}[] on it, or press ? on a recipe.
tutorial.unguidable=The starting base does not match the tutorial layout, so the guide cannot continue. Close this panel and play on, or start a new game.
tutorial.lowbalance=[scarlet]The balance is below {0}, so CodeRabbit cannot be placed. Start the tutorial again from the menu.
