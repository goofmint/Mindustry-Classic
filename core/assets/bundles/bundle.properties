block.stonewall.name=basic rules
block.stonewall.description=A cheap, basic rule set that blocks the enemy's path.
block.stonewall.fulldescription=A cheap rule set that blocks the bugs' path. Useful for protecting production and turrets in the first waves.
block.ironwall.name=OWASP rules
block.ironwall.description=Follows a well-known security standard and holds longer than basic rules.
block.ironwall.fulldescription=Rules based on a well-known security standard. Holds longer than basic rules.
block.titaniumwall.name=custom rules
block.titaniumwall.description=Sturdy rules tailored to your own system.
block.titaniumwall.fulldescription=Sturdy rules tailored to your own system.
block.steelwall-large.name=managed rules
block.steelwall-large.description=Rules maintained by specialists that cover a wide area.
block.steelwall-large.fulldescription=Rules maintained by specialists. Spans multiple tiles.
block.titaniumwall-large.name=enterprise WAF
block.titaniumwall-large.description=Heavy-duty protection for large systems that covers a wide area.
block.titaniumwall-large.fulldescription=Heavy-duty protection for large systems. Strong, and spans multiple tiles.
block.titaniumshieldwall.name=AI shield
block.titaniumshieldwall.description=A wall that spends tokens to cancel out incoming damage.
block.titaniumshieldwall.fulldescription=A sturdy rule with a built-in shield. Spends tokens to cancel out incoming damage. Feed it tokens with an AI gateway.
block.repairturret.name=AI auto-fix
block.repairturret.description=Uses tokens to repair damaged blocks nearby.
block.repairturret.fulldescription=Uses a few tokens to slowly repair damaged blocks within range.
block.megarepairturret.name=AI auto-fix (pro)
block.megarepairturret.description=Uses tokens to repair blocks faster over a wider area.
block.megarepairturret.fulldescription=Uses tokens to repair damaged blocks faster, over a wider range.
block.shieldgenerator.name=firewall
block.shieldgenerator.description=Uses tokens to raise a shield that blocks enemy bullets.
block.shieldgenerator.fulldescription=Raises a shield that protects every block within its radius from bug attacks. Uses few tokens while idle, but drains them quickly while blocking bullets.
block.door.name=feature flag
block.door.description=Toggle it to open or close the path.
block.door.fulldescription=Tap it to switch the path open or closed.
block.door-large.name=maintenance mode
block.door-large.description=Opens or closes a wide path at once.
block.door-large.fulldescription=Tap it to open or close a wide path at once. Spans multiple tiles.
block.conduit.name=conduit
block.conduit.description=A pipe that moves liquids.
block.conduit.fulldescription=A basic pipe for liquids. Carries water to the AI data center and vGPU or dGPU to the generators. Best used with pumps or other conduits.
block.pulseconduit.name=pulse conduit
block.pulseconduit.description=Moves more liquid, faster than a conduit.
block.pulseconduit.fulldescription=An advanced conduit. Moves liquid faster and holds more than a conduit.
block.liquidrouter.name=liquid router
block.liquidrouter.description=Takes in liquids and distributes them to neighboring blocks.
block.liquidrouter.fulldescription=Takes in liquid from one side and outputs it to the other sides. Useful for splitting one conduit into several.
block.conveyor.name=pipeline (normal)
block.conveyor.description=The basic pipeline that moves items to the next block.
block.conveyor.fulldescription=The basic pipeline. Carries code and other items forward and hands them to the block it faces, such as a quality station or production. Rotatable. Code keeps its quality on the way.
block.steelconveyor.name=pipeline (fast)
block.steelconveyor.description=Moves items twice as fast as the normal pipeline.
block.steelconveyor.fulldescription=A faster pipeline. Moves items twice as fast as the normal pipeline.
block.poweredconveyor.name=pipeline (ultra)
block.poweredconveyor.description=The fastest pipeline for moving items.
block.poweredconveyor.fulldescription=The fastest pipeline. Suited to busy lines fed by many AI coding agents.
block.router.name=PR
block.router.description=Takes in items and distributes them to neighboring blocks.
block.router.fulldescription=Collects items and hands them to the neighboring blocks. It does not change the quality of code. Useful for splitting one line of code into several quality stations. It sometimes sends items back the way they came.
block.junction.name=crosspoint
block.junction.description=Lets two crossing pipelines pass through without mixing.
block.junction.fulldescription=Lets two crossing pipelines pass through without mixing their items.
block.conveyortunnel.name=bypass
block.conveyortunnel.description=Carries items underground, skipping over the blocks in between.
block.conveyortunnel.fulldescription=Carries items underground, skipping the blocks in between. Use them in pairs facing opposite directions: the entrance faces the pipeline that feeds it, and the exit, up to 3 tiles behind it, faces the block it feeds.
block.liquidjunction.name=liquid junction
block.liquidjunction.description=Lets two crossing conduits pass through without mixing.
block.liquidjunction.fulldescription=Lets two crossing conduits pass through without mixing their liquids.
block.powerbooster.name=AI gateway
block.powerbooster.description=Distributes tokens to blocks around it.
block.powerbooster.fulldescription=Distributes tokens to every block within its range.
block.powerlaser.name=private link
block.powerlaser.description=Sends tokens to the block it faces.
block.powerlaser.fulldescription=Sends tokens by laser to the block in front of it. Generates nothing itself. Use it to carry tokens from a generator to AI coding agents, test and CI stations, or turrets.
block.powerlaserrouter.name=load balancer
block.powerlaserrouter.description=Relays tokens and splits them in three directions.
block.powerlaserrouter.fulldescription=Relays tokens and splits them in three directions at once. Useful for feeding several blocks from one generator.
block.powerlasercorner.name=proxy
block.powerlasercorner.description=Relays tokens in two directions.
block.powerlasercorner.fulldescription=Relays tokens in two directions at once. Useful when one generator has to feed blocks in two directions only.
block.teleporter.name=API link
block.teleporter.description=Uses tokens to send items instantly to linked blocks of the same color.
block.teleporter.fulldescription=Uses tokens to send items instantly to another API link of the same color. Does nothing if there is no other link of that color; if there are several, one is chosen at random. Tap to change the color.
block.core.name=production
block.core.description=The production environment you must protect; losing it ends the game.
block.core.fulldescription=The production environment. Delivering code here releases it, and your balance changes by quality x importance: code with negative quality takes balance away. Other items are accepted but score nothing.\nThe lower the quality of recent releases, the more bugs come. If the bugs destroy it, the game is over.
block.pump.name=pump
block.pump.description=Place it on a liquid floor to pump up water, vGPU or dGPU.
block.pump.fulldescription=Place it on a liquid floor. Pumps up water, vGPU or dGPU and outputs it into nearby conduits. vGPU and dGPU are fuel for the cloud and on-premise generators; water cools the AI data center.
block.fluxpump.name=flux pump
block.fluxpump.description=Pumps more liquid than a pump.
block.fluxpump.fulldescription=An advanced pump. Stores more liquid and pumps it faster.
block.coaldrill.name=electronics store
block.coaldrill.description=Place it on a stock floor to procure fuel for generators.
block.coaldrill.fulldescription=Place it on an iGPU stock floor. Slowly procures iGPU, the fuel of the local GPU.
block.uraniumdrill.name=vendor
block.uraniumdrill.description=Place it on a stock floor to procure fuel for high-end generators.
block.uraniumdrill.fulldescription=Place it on a PCIe stock floor. Slowly procures PCIe, the fuel of the overseas cloud and the AI data center.
block.human-engineer.name=human engineer
block.human-engineer.description=Writes fairly good code on a code vein without using tokens, but slowly.
block.human-engineer.fulldescription=Place it on a code vein. Writes code slowly, without using tokens. The code starts at fairly good quality (-2 or -1), and its importance (normal or critical) is chosen at random. It costs more than an AI coding agent, but needs no token supply, so it works on any vein.
block.ai-agent-1.name=AI coding agent I
block.ai-agent-1.description=Uses tokens to write low-quality code quickly on a code vein.
block.ai-agent-1.fulldescription=Place it on a code vein. Uses tokens for every piece of code and writes much faster than a human engineer, but the quality is low (-5 or -3). Send its code through review, test and CI before release. Stops while it is out of tokens.\nTo upgrade, place a higher AI coding agent directly over it.
block.ai-agent-2.name=AI coding agent II
block.ai-agent-2.description=Uses more tokens to write code of mixed quality quickly on a code vein.
block.ai-agent-2.fulldescription=Place it on a code vein. Uses more tokens per piece of code than the first level, and the quality varies (-3 or -1). Writes as fast as the first level. Stops while it is out of tokens.\nTo upgrade, place the top AI coding agent directly over it.
block.ai-agent-3.name=AI coding agent III
block.ai-agent-3.description=Uses the most tokens to write fairly good code quickly on a code vein.
block.ai-agent-3.fulldescription=Place it on a code vein. Uses the most tokens per piece of code, and always writes fairly good code (-1), as fast as the lower levels. Stops while it is out of tokens. This is the top level.
block.senior-engineer.name=senior engineer
block.senior-engineer.description=Reviews code and raises its quality by one stage without using tokens, but slowly.
block.senior-engineer.fulldescription=A review station. Takes one piece of code at a time, raises its quality by one stage and marks it as reviewed. Uses no tokens, but takes its time.\nReview, test and CI can be passed in any order. Code that is already reviewed (here or by CodeRabbit) gains nothing from another review, but still takes the full time. Accepts only code.
block.unit-test.name=unit test
block.unit-test.description=Tests code and raises its quality by one stage, using tokens.
block.unit-test.fulldescription=A test station. Uses tokens to raise the quality of each piece of code by one stage and mark it as tested. Fast and cheap.\nCode that is already tested (here or by an E2E test) gains nothing from another test, but still costs time and tokens. Pauses while it is out of tokens.
block.e2e-test.name=E2E test
block.e2e-test.description=Tests code end to end and raises its quality by one stage, using more tokens and time.
block.e2e-test.fulldescription=A test station that tests code end to end. Raises quality by one stage and marks the code as tested, like a unit test, but uses more tokens and time.\nIt is the same test category as a unit test: passing both raises quality only once, and the second pass just costs time and tokens. Pauses while it is out of tokens.
block.jenkins.name=Jenkins
block.jenkins.description=Runs CI on code and raises its quality by one stage, using tokens.
block.jenkins.fulldescription=A CI station. Uses tokens to raise the quality of each piece of code by one stage and mark it as CI passed.\nCode that has already passed CI (here or in GitHub Actions) gains nothing from another run, but still costs time and tokens. Pauses while it is out of tokens.
block.github-actions.name=GitHub Actions
block.github-actions.description=Runs CI on code and quickly raises its quality by one stage, using tokens.
block.github-actions.fulldescription=A CI station that runs faster than Jenkins for the same tokens, at a higher price. Raises quality by one stage and marks the code as CI passed.\nCode that has already passed CI (here or in Jenkins) gains nothing from another run, but still costs time and tokens. Pauses while it is out of tokens.
block.coalgenerator.name=local GPU
block.coalgenerator.description=Generates tokens from fuel on a local GPU.
block.coalgenerator.fulldescription=The basic generator. Burns iGPU to generate tokens, and sends them by laser to its 4 sides.
block.thermalgenerator.name=on-premise
block.thermalgenerator.description=Generates tokens from dGPU on your own hardware.
block.thermalgenerator.fulldescription=Generates tokens from dGPU supplied through conduits, and sends them by laser to its 4 sides.
block.combustiongenerator.name=domestic cloud
block.combustiongenerator.description=Generates tokens from vGPU in a domestic cloud.
block.combustiongenerator.fulldescription=Generates tokens from vGPU supplied through conduits, and sends them by laser to its 4 sides.
block.rtgenerator.name=overseas cloud
block.rtgenerator.description=Keeps generating tokens from fuel for a long time in an overseas cloud.
block.rtgenerator.fulldescription=Generates a small amount of tokens from PCIe, for a long time per item. Sends them by laser to its 4 sides.
block.nuclearreactor.name=AI data center
block.nuclearreactor.description=Generates a large amount of tokens from fuel; keep it supplied with cooling water.
block.nuclearreactor.fulldescription=The largest token generator. Generates tokens from PCIe, but must be cooled with water constantly. If the water runs short, it overheats and explodes violently, destroying the blocks around it.
block.turret.name=linter
block.turret.description=The simplest defense, shooting at approaching enemies.
block.turret.fulldescription=The basic, cheap turret. Shoots at approaching bugs with tokens. Slightly longer range than a type checker. Stops while it is out of tokens.
block.doubleturret.name=type checker
block.doubleturret.description=Fires from two barrels to stop more enemies than a linter.
block.doubleturret.fulldescription=Fires two bullets at once with tokens. Shorter range than a linter, but hits harder overall.
block.machineturret.name=fuzzer
block.machineturret.description=Rapid fire that wears down enemies as they keep coming.
block.machineturret.fulldescription=A dependable all-round turret. Fires rapidly with tokens and wears down bugs as they keep coming.
block.shotgunturret.name=penetration test
block.shotgunturret.description=Fires a spread of shots that hits several nearby enemies at once.
block.shotgunturret.fulldescription=Fires a spread of shots with tokens, hitting several nearby bugs at once. Short range.
block.flameturret.name=hotfix
block.flameturret.description=Short range, but quickly burns down enemies right in front of it.
block.flameturret.fulldescription=Burns bugs right in front of it with tokens. Very short range, but very high damage. Best placed behind walls.
block.sniperturret.name=security audit
block.sniperturret.description=Picks off distant enemies with heavy single shots.
block.sniperturret.fulldescription=Picks off distant bugs with heavy single shots. Very high damage and long range, but a slow fire rate and a high token cost per shot.
block.mortarturret.name=rate limiter
block.mortarturret.description=Holds back distant groups of enemies with area attacks.
block.mortarturret.fulldescription=Fires inaccurate shells that burst into fragments, holding back distant groups of bugs. Uses many tokens per shot.
block.laserturret.name=alert
block.laserturret.description=Uses tokens to catch enemies quickly with a laser.
block.laserturret.fulldescription=Catches a single bug with a laser that never misses. Medium range. Uses tokens.
block.waveturret.name=observability
block.waveturret.description=Uses tokens to hit nearby enemies with chaining lightning.
block.waveturret.fulldescription=Hits several bugs at once with chaining lightning that never misses. Medium range, modest damage. Uses tokens.
block.plasmaturret.name=rollback
block.plasmaturret.description=Sprays hot plasma to clear out nearby enemies in one go.
block.plasmaturret.fulldescription=Sprays hot plasma at nearby bugs with tokens. Very high damage at short to medium range.
block.chainturret.name=regression test suite
block.chainturret.description=Heavy rapid fire that keeps even large enemies in check.
block.chainturret.fulldescription=Fires large slugs at a high rate with tokens, keeping even large bugs in check. Medium range. Spans multiple tiles and is very tough.
block.titancannon.name=AI security agent
block.titancannon.description=The strongest cannon, able to take on boss-level enemies.
block.titancannon.fulldescription=The strongest cannon. Fires large splash-damage shells with tokens, able to take on boss-level bugs. Long range, but uses many tokens per shot. Spans multiple tiles and is very tough.
block.coderabbit.name=CodeRabbit
block.coderabbit.description=Reviews code to raise its quality by two stages, while shooting enemies down with tokens.
block.coderabbit.fulldescription=AI code review and defense in one block. Raises the quality of each piece of code by two stages and marks it as reviewed: twice the gain of a senior engineer, and faster. At the same time, it shoots down bugs in range.\nBoth jobs share one token pool. Shooting comes first: when tokens run low, reviews wait, and when they run out, shooting stops too. Code that is already reviewed gains nothing here, but still costs time and tokens.
block.playerspawn.name=playerspawn
block.enemyspawn.name=enemyspawn