text.about=[accent]Original game[]\nThis game is a modified version of [orange]Mindustry Classic[] by [ROYAL]Anuken[]. The changes from the original were made in 2026.\n\nOriginal credits:\n- Created by [ROYAL]Anuken[]. Originally an entry in the [orange]GDL[] Metal Monstrosity Jam.\n- SFX made with [YELLOW]bfxr[]\n- Music made by [GREEN]a drop a day[]\n\nSpecial thanks to:\n- [coral]MitchellFJN[]: extensive playtesting and feedback\n- [sky]Luxray5474[]: wiki work, code contributions\n- [lime]Epowerj[]: code build system, icon\n- All the beta testers on itch.io and Google Play
text.credits=Credits
text.credits.coderabbit=[accent]About CodeRabbit[]\nCodeRabbit is an AI code review tool for pull requests. It reads the changes in a pull request and comments on the problems it finds.\nIn this game, the CodeRabbit block reviews the code that passes through it, raising its quality by two stages, and shoots down the bugs that attack production.
text.credits.license=[accent]License (GPL-3.0)[]\nThis game is free software, distributed under the GNU General Public License version 3 (GPL-3.0), the same license as the original Mindustry Classic. It comes with ABSOLUTELY NO WARRANTY.\nSource code: https://github.com/goofmint/Mindustry-Classic
text.credits.font=[accent]Font[]\nJapanese text uses the Misaki font (Misaki Gothic 2nd, version 2021-05-05) by Num Kadoma, distributed at littlelimit.net.
