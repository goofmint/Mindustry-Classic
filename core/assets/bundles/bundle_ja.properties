text.about=制作: [ROYAL]Anuken[] - [SKY]anukendev@gmail.com[]\nもとは [orange]GDL[] Metal Monstrosity Jam の応募作です。\n\nクレジット:\n- 効果音: [YELLOW]bfxr[] で制作\n- 音楽: [GREEN]a drop a day[](YouTube で聴けます)\n\nスペシャルサンクス:\n- [coral]MitchellFJN[]: たくさんのテストプレイとフィードバック\n- [sky]Luxray5474[]: Wiki の編集、コードへの貢献\n- [lime]Epowerj[]: ビルドシステム、アイコン\n- itch.io と Google Play のベータテスターのみなさん\n
