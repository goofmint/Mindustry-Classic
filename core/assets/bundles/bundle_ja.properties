block.stonewall.name=基本ルール
block.stonewall.description=敵の進路をふさぐ、安価で基本的な防御ルール。
block.stonewall.fulldescription=バグの進路をふさぐ、安価な防御ルール。序盤のウェーブで、本番環境や迎撃の施設を守るのに役立つ。
block.ironwall.name=OWASPルール
block.ironwall.description=定番のセキュリティ基準にならい、基本ルールより固く守る。
block.ironwall.fulldescription=定番のセキュリティ基準にならった防御ルール。基本ルールより長く持ちこたえる。
block.titaniumwall.name=カスタムルール
block.titaniumwall.description=自社向けに作り込んだ、頑丈な防御ルール。
block.titaniumwall.fulldescription=自社向けに作り込んだ、頑丈な防御ルール。
block.steelwall-large.name=マネージドルール
block.steelwall-large.description=専門家が保守する、広い範囲を守る防御ルール。
block.steelwall-large.fulldescription=専門家が保守する防御ルール。複数のタイルを占める。
block.titaniumwall-large.name=エンタープライズWAF
block.titaniumwall-large.description=広い範囲を固く守る、大規模向けの防御。
block.titaniumwall-large.fulldescription=大規模向けの頑丈な防御。複数のタイルを占める。
block.titaniumshieldwall.name=AIシールド
block.titaniumshieldwall.description=トークンを使って、受けた攻撃を打ち消す壁。
block.titaniumshieldwall.fulldescription=シールドを内蔵した頑丈な防御ルール。トークンを使って受けた攻撃を打ち消す。AIゲートウェイでトークンを送るとよい。
block.repairturret.name=AIによる自動修正
block.repairturret.description=トークンを使い、近くの壊れた施設を直す。
block.repairturret.fulldescription=少しのトークンを使い、範囲内の壊れたブロックをゆっくり直す。
block.megarepairturret.name=AIによる自動修正(高性能)
block.megarepairturret.description=トークンを使い、より広い範囲の施設をすばやく直す。
block.megarepairturret.fulldescription=トークンを使い、より広い範囲の壊れたブロックを速く直す。
block.shieldgenerator.name=ファイアウォール
block.shieldgenerator.description=トークンを使ってシールドを張り、敵の弾を防ぐ。
block.shieldgenerator.fulldescription=シールドを張り、範囲内のブロックをバグの攻撃から守る。待機中のトークン消費は少ないが、弾を防ぐと急速に減る。
block.door.name=フィーチャーフラグ
block.door.description=開け閉めを切り替えて、通り道を開いたり閉じたりする。
block.door.fulldescription=タップで通り道を開け閉めする。
block.door-large.name=メンテナンスモード
block.door-large.description=広い通り道を、まとめて開け閉めする。
block.door-large.fulldescription=タップで広い通り道をまとめて開け閉めする。複数のタイルを占める。
block.conduit.name=導管
block.conduit.description=液体を運ぶ管。
block.conduit.fulldescription=基本の液体の管。AIデータセンターへ水を、発電の施設へ vGPU や dGPU を運ぶ。ポンプや別の導管とつないで使う。
block.pulseconduit.name=パルス導管
block.pulseconduit.description=導管より多くの液体を速く運ぶ。
block.pulseconduit.fulldescription=導管の上位版。導管より速く運び、多くためられる。
block.liquidrouter.name=液体ルーター
block.liquidrouter.description=液体を受け取り、隣に振り分ける。
block.liquidrouter.fulldescription=1 方向から液体を受け取り、ほかの方向へ流す。1 本の導管を複数に分けるのに使う。
block.conveyor.name=パイプライン(通常)
block.conveyor.description=アイテムを次の施設へ流す、基本のパイプライン。
block.conveyor.fulldescription=基本のパイプライン。コードなどのアイテムを前へ運び、品質の施設や本番環境など、向いている先のブロックへ渡す。回転できる。運ぶ間にコードの品質は変わらない。
block.steelconveyor.name=パイプライン(高速)
block.steelconveyor.description=通常の倍の速さでアイテムを流す。
block.steelconveyor.fulldescription=速いパイプライン。通常のパイプラインの倍の速さでアイテムを運ぶ。
block.poweredconveyor.name=パイプライン(超高速)
block.poweredconveyor.description=いちばん速くアイテムを流すパイプライン。
block.poweredconveyor.fulldescription=いちばん速いパイプライン。AIコーディングエージェントを並べた、流れの多いラインに向く。
block.router.name=PR
block.router.description=アイテムを受け取り、隣の施設に振り分ける。
block.router.fulldescription=アイテムを受け取ってためておき、隣のブロックへ配る。コードの品質は変えない。1 本のコードの流れを、複数の品質の施設へ分けるのに使う。受け取った方向へ送り返すこともある。
block.junction.name=クロスポイント
block.junction.description=交差する2本のパイプラインを、混ぜずに通す。
block.junction.fulldescription=交差する 2 本のパイプラインを、中身を混ぜずに通す。
block.conveyortunnel.name=バイパス
block.conveyortunnel.description=地下をくぐり、間にある施設を飛び越えて運ぶ。
block.conveyortunnel.fulldescription=アイテムを地下に通し、間にあるブロックを飛び越えて運ぶ。2 つ 1 組で、互いに逆向きに置く。入口は流れてくるパイプラインの方を向け、出口は入口の後ろ 3 タイル以内に、渡す先のブロックの方を向けて置く。
block.liquidjunction.name=液体ジャンクション
block.liquidjunction.description=交差する2本の導管を、混ぜずに通す。
block.liquidjunction.fulldescription=交差する 2 本の導管を、中身を混ぜずに通す。
block.powerbooster.name=AIゲートウェイ
block.powerbooster.description=周囲の施設にトークンを配る。
block.powerbooster.fulldescription=範囲内のすべてのブロックにトークンを配る。
block.powerlaser.name=プライベート接続
block.powerlaser.description=向いている方向の施設へトークンを送る。
block.powerlaser.fulldescription=前方のブロックへレーザーでトークンを送る。自分ではトークンを作らない。発電の施設から、AIコーディングエージェント、テストや CI の施設、迎撃の施設へトークンを運ぶのに使う。
block.powerlaserrouter.name=ロードバランサー
block.powerlaserrouter.description=トークンを中継し、3方向へ振り分ける。
block.powerlaserrouter.fulldescription=トークンを中継し、3 方向へ同時に振り分ける。1 つの発電の施設から、複数のブロックへ送るのに使う。
block.powerlasercorner.name=プロキシ
block.powerlasercorner.description=トークンを中継し、2方向へ送る。
block.powerlasercorner.fulldescription=トークンを中継し、2 方向へ同時に送る。1 つの発電の施設から、2 方向のブロックだけへ送りたいときに使う。
block.teleporter.name=API連携
block.teleporter.description=トークンを使い、同じ色の連携先へアイテムを瞬時に送る。
block.teleporter.fulldescription=トークンを使い、同じ色の別の API連携へアイテムを瞬時に送る。同じ色の連携先がなければ何もしない。複数あれば、ランダムに 1 つ選ぶ。タップで色を変えられる。
block.core.name=本番環境
block.core.description=守るべき本番環境で、壊されるとゲームオーバー。
block.core.fulldescription=本番環境。ここへコードを納品するとリリースになり、品質×重要度の分だけ残高が増減する。品質がマイナスのコードは残高を減らす。コード以外のアイテムも受け取るが、得点にはならない。\n最近リリースしたコードの品質が低いほど、バグが増える。バグに壊されるとゲームオーバー。
block.pump.name=ポンプ
block.pump.description=液体の床に置き、水、vGPU、dGPUをくみ上げる。
block.pump.fulldescription=液体の床に置く。水、vGPU、dGPU をくみ上げ、隣の導管へ流す。vGPU と dGPU は国内クラウドとオンプレミスの燃料、水は AIデータセンターの冷却に使う。
block.fluxpump.name=フラックスポンプ
block.fluxpump.description=ポンプより多くの液体をくみ上げる。
block.fluxpump.fulldescription=ポンプの上位版。液体を多くため、速くくみ上げる。
block.coaldrill.name=家電屋
block.coaldrill.description=在庫の床に置き、発電機の燃料を仕入れる。
block.coaldrill.fulldescription=iGPU の在庫の床に置く。ローカルGPUの燃料になる iGPU を、ゆっくり仕入れ続ける。
block.uraniumdrill.name=ベンダー
block.uraniumdrill.description=在庫の床に置き、上位の発電機向けの燃料を仕入れる。
block.uraniumdrill.fulldescription=PCIe の在庫の床に置く。海外クラウドと AIデータセンターの燃料になる PCIe を、ゆっくり仕入れ続ける。
block.human-engineer.name=人間のエンジニア
block.human-engineer.description=コード鉱脈の上で、トークンを使わずにそこそこ良いコードをゆっくり書く。
block.human-engineer.fulldescription=コード鉱脈の上に置く。トークンを使わずに、ゆっくりコードを書く。書いたコードの品質はそこそこ良く(-2 か -1)、重要度(通常か重要)はランダムに決まる。AIコーディングエージェントより高いが、トークンの供給が要らないので、鉱脈さえあればどこでも動く。
block.ai-agent-1.name=AIコーディングエージェント(初期)
block.ai-agent-1.description=コード鉱脈の上で、トークンを使って質の低いコードを速く書く。
block.ai-agent-1.fulldescription=コード鉱脈の上に置く。コードを 1 個書くごとにトークンを使い、人間のエンジニアよりずっと速く書くが、品質は低い(-5 か -3)。リリースの前に、レビュー、テスト、CI を通すこと。トークンが尽きている間は止まる。\n上位のAIコーディングエージェントをそのまま上に置くと、置き換えて強化できる。
block.ai-agent-2.name=AIコーディングエージェント(中間)
block.ai-agent-2.description=コード鉱脈の上で、より多くのトークンを使って質にばらつきのあるコードを速く書く。
block.ai-agent-2.fulldescription=コード鉱脈の上に置く。初期より多くのトークンをコード 1 個ごとに使い、品質にばらつきがある(-3 か -1)。書く速さは初期と同じ。トークンが尽きている間は止まる。\n最上位のAIコーディングエージェントをそのまま上に置くと、置き換えて強化できる。
block.ai-agent-3.name=AIコーディングエージェント(最上位)
block.ai-agent-3.description=コード鉱脈の上で、最も多くのトークンを使ってそこそこ良いコードを速く書く。
block.ai-agent-3.fulldescription=コード鉱脈の上に置く。コード 1 個ごとに使うトークンは最も多いが、いつもそこそこ良いコード(-1)を、下位と同じ速さで書く。トークンが尽きている間は止まる。これが最上位。
block.senior-engineer.name=シニアエンジニア
block.senior-engineer.description=コードをレビューし、トークンを使わずに時間をかけて品質を 1 段階上げる。
block.senior-engineer.fulldescription=レビューの施設。コードを 1 個ずつ受け取り、品質を 1 段階上げてレビュー済にする。トークンは使わないが、時間がかかる。\nレビュー、テスト、CI はどの順に通してもよい。すでにレビュー済のコード(ここか CodeRabbit を通ったもの)は、もう一度通しても品質が上がらず、処理時間だけかかる。受け取るのはコードだけ。
block.unit-test.name=ユニットテスト
block.unit-test.description=コードをテストし、トークンを使って品質を 1 段階上げる。
block.unit-test.fulldescription=テストの施設。トークンを使い、コードの品質を 1 個ずつ 1 段階上げてテスト済にする。速くて安い。\nすでにテスト済のコード(ここか E2Eテストを通ったもの)は、もう一度通しても品質が上がらず、処理時間とトークンだけかかる。トークンが足りない間は止まる。
block.e2e-test.name=E2Eテスト
block.e2e-test.description=コードを端から端までテストし、より多くのトークンと時間を使って品質を 1 段階上げる。
block.e2e-test.fulldescription=コードを端から端までテストする施設。ユニットテストと同じく品質を 1 段階上げてテスト済にするが、トークンも時間も多くかかる。\nユニットテストと同じテストのカテゴリなので、両方を通しても上がるのは 1 回だけで、2 回目は処理時間とトークンだけかかる。トークンが足りない間は止まる。
block.jenkins.name=Jenkins
block.jenkins.description=コードに CI をかけ、トークンを使って品質を 1 段階上げる。
block.jenkins.fulldescription=CI の施設。トークンを使い、コードの品質を 1 個ずつ 1 段階上げて CI 済にする。\nすでに CI 済のコード(ここか GitHub Actions を通ったもの)は、もう一度通しても品質が上がらず、処理時間とトークンだけかかる。トークンが足りない間は止まる。
block.github-actions.name=GitHub Actions
block.github-actions.description=コードに CI をかけ、トークンを使って品質を素早く 1 段階上げる。
block.github-actions.fulldescription=Jenkins と同じトークンで速く回る CI の施設。値段は高い。品質を 1 段階上げて CI 済にする。\nすでに CI 済のコード(ここか Jenkins を通ったもの)は、もう一度通しても品質が上がらず、処理時間とトークンだけかかる。トークンが足りない間は止まる。
block.coalgenerator.name=ローカルGPU
block.coalgenerator.description=手元のGPUで、燃料からトークンを作る。
block.coalgenerator.fulldescription=基本の発電の施設。iGPU を燃料にトークンを作り、4 方向へレーザーで送る。
block.thermalgenerator.name=オンプレミス
block.thermalgenerator.description=自社の設備で、dGPUからトークンを作る。
block.thermalgenerator.fulldescription=導管から受け取った dGPU でトークンを作り、4 方向へレーザーで送る。
block.combustiongenerator.name=国内クラウド
block.combustiongenerator.description=国内のクラウドで、vGPUからトークンを作る。
block.combustiongenerator.fulldescription=導管から受け取った vGPU でトークンを作り、4 方向へレーザーで送る。
block.rtgenerator.name=海外クラウド
block.rtgenerator.description=海外のクラウドで、燃料から長くトークンを作り続ける。
block.rtgenerator.fulldescription=PCIe を燃料に、少しずつ長くトークンを作る。4 方向へレーザーで送る。
block.nuclearreactor.name=AIデータセンター
block.nuclearreactor.description=冷却水を絶やさずに、燃料から大量のトークンを作る。
block.nuclearreactor.fulldescription=最大の発電の施設。PCIe からトークンを作るが、水で冷やし続ける必要がある。水が足りないと過熱し、周りのブロックを巻き込んで激しく爆発する。
block.turret.name=リンター
block.turret.description=近づく敵を撃つ、いちばん手軽な防衛。
block.turret.fulldescription=基本の安い迎撃の施設。トークンを使い、近づくバグを撃つ。射程は型チェッカーより少し長い。トークンが尽きている間は止まる。
block.doubleturret.name=型チェッカー
block.doubleturret.description=2門で撃ち、リンターより多くの敵を止める。
block.doubleturret.fulldescription=トークンを使い、2 発ずつ撃つ。射程はリンターより短いが、与えるダメージは大きい。
block.machineturret.name=ファジング
block.machineturret.description=すばやい連射で、次々に来る敵を削る。
block.machineturret.fulldescription=使い勝手のよい迎撃の施設。トークンを使って速く連射し、次々に来るバグを削る。
block.shotgunturret.name=ペネトレーションテスト
block.shotgunturret.description=一度に広く撃ち、近くの敵をまとめて叩く。
block.shotgunturret.fulldescription=トークンを使って弾を扇状に撃ち、近くのバグをまとめて叩く。射程は短い。
block.flameturret.name=ホットフィックス
block.flameturret.description=射程は短いが、目の前の敵をすばやく焼き払う。
block.flameturret.fulldescription=トークンを使い、目の前のバグを焼き払う。射程はとても短いが、ダメージはとても大きい。防御ルールの後ろに置くとよい。
block.sniperturret.name=セキュリティ監査
block.sniperturret.description=遠くの敵を、重い一撃で狙い撃つ。
block.sniperturret.fulldescription=遠くのバグを重い一撃で狙い撃つ。ダメージが大きく射程も長いが、連射は遅く、1 発に使うトークンが多い。
block.mortarturret.name=レートリミッター
block.mortarturret.description=遠くの敵の群れを、範囲攻撃で抑え込む。
block.mortarturret.fulldescription=破片をまき散らして炸裂する弾を撃ち、遠くのバグの群れを抑え込む。精度は低く、1 発に使うトークンが多い。
block.laserturret.name=アラート
block.laserturret.description=トークンを使い、レーザーで敵をすばやく捉える。
block.laserturret.fulldescription=必ず当たるレーザーで、バグを 1 体ずつ捉える。中距離。トークンを使う。
block.waveturret.name=オブザーバビリティ
block.waveturret.description=トークンを使い、連鎖する電撃で周りの敵をまとめて捉える。
block.waveturret.fulldescription=連鎖する電撃で、複数のバグに同時に当てる。必ず当たる。中距離で、ダメージは控えめ。トークンを使う。
block.plasmaturret.name=ロールバック
block.plasmaturret.description=高熱のプラズマを浴びせ、近くの敵を一気に片付ける。
block.plasmaturret.fulldescription=トークンを使い、近くのバグに高熱のプラズマを浴びせる。射程は短めから中くらいで、ダメージはとても大きい。
block.chainturret.name=回帰テストスイート
block.chainturret.description=重い連射で、大きな敵も止め続ける。
block.chainturret.fulldescription=トークンを使い、大きな弾を高速で連射して、大きなバグも止め続ける。中距離。複数のタイルを占め、とても頑丈。
block.titancannon.name=AIセキュリティエージェント
block.titancannon.description=最強の砲撃で、ボス級の敵にも立ち向かう。
block.titancannon.fulldescription=最強の砲撃。トークンを使い、範囲ダメージを与える大きな砲弾を撃って、ボス級のバグにも立ち向かう。射程は長いが、1 発に使うトークンが多い。複数のタイルを占め、とても頑丈。
block.coderabbit.name=CodeRabbit
block.coderabbit.description=コードをレビューして品質を 2 段階上げ、同時にトークンで敵を迎撃する。
block.coderabbit.fulldescription=AIによるコードレビューと迎撃を、1 つでこなすブロック。コードの品質を 1 個ずつ 2 段階上げてレビュー済にする。上がり幅はシニアエンジニアの倍で、処理も速い。同時に、射程に入ったバグを撃ち落とす。\n2 つの仕事は同じトークンの残量を分け合う。迎撃が優先で、トークンが少なくなるとレビューが待たされ、尽きると迎撃も止まる。すでにレビュー済のコードは、通しても品質が上がらず、処理時間とトークンだけかかる。
block.playerspawn.name=プレイヤーの出現地点
block.enemyspawn.name=敵の出現地点
