name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定のトークン権限は読み取りだけにする。deploy ジョブは自分の permissions で pages/id-token を足す
permissions:
  contents: read

# ワークフロー全体で同じ ref の実行を直列にする。main では実行中のデプロイを止めない(GitHub の Pages
# ワークフローの推奨)。待ちの実行は最新の 1 本だけ残るが、GitHub は待ち行列の順序を保証しないので、
# 古いビルドの配置は deploy ジョブの先頭で main の最新 SHA と比べて飛ばす。PR では新しい push が古い実行を取り消す。
# 手動実行(workflow_dispatch)と push が同じ待ち行列に入らないよう、group にはイベント種別も含める
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build
        run: ./gradlew :core:compileJava :desktop:compileJava :html:dist --no-daemon

      - name: Verify html output
        run: |
          test -f html/build/dist/index.html
          test -f html/build/dist/html/html.nocache.js
          test -f html/build/dist/.nojekyll

      - uses: actions/upload-artifact@v7
        with:
          name: html-dist
          path: html/build/dist
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: html/build/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 待ち行列の順序は保証されないので、この実行のコミットが main の最新でなければ配置しない
      - id: latest
        name: Check that this commit is still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 一時的な API エラーは 3 回まで再試行する。取れなければ実行 SHA で代用せず、ジョブを失敗させる
          head=""
          for attempt in 1 2 3; do
            if head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha) && [ -n "$head" ]; then
              break
            fi
            head=""
            if [ "$attempt" -eq 3 ]; then echo "::error::could not read the head of main after 3 attempts"; exit 1; fi
            sleep 5
          done
          echo "run=${GITHUB_SHA} main=${head}"
          if [ "$head" = "$GITHUB_SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; echo "::notice::main has moved on; skipping this deployment"; fi

      # Pages 自体の有効化(Settings → Pages → Source = GitHub Actions)は手動。
      # configure-pages の enablement は GITHUB_TOKEN では権限不足で失敗するため使わない。
      - if: steps.latest.outputs.latest == 'true'
        uses: actions/configure-pages@v5

      - id: deployment
        if: steps.latest.outputs.latest == 'true'
        uses: actions/deploy-pages@v4
