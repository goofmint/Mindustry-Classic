name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定のトークン権限は読み取りだけにする。deploy ジョブは自分の permissions で pages/id-token を足す
permissions:
  contents: read

# ワークフロー全体で同じ ref の実行を直列にする。main では実行中のデプロイを止めず(GitHub の Pages
# ワークフローの推奨)、待ちの実行は最新の 1 本だけ残るので、古いビルドが新しい配置を上書きしない。
# PR では新しい push が古い実行を取り消す
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build
        run: ./gradlew :core:compileJava :desktop:compileJava :html:dist --no-daemon

      - name: Verify html output
        run: |
          test -f html/build/dist/index.html
          test -f html/build/dist/html/html.nocache.js
          test -f html/build/dist/.nojekyll

      - uses: actions/upload-artifact@v7
        with:
          name: html-dist
          path: html/build/dist
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: html/build/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 自体の有効化(Settings → Pages → Source = GitHub Actions)は手動。
      # configure-pages の enablement は GITHUB_TOKEN では権限不足で失敗するため使わない。
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
