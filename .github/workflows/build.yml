name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew :core:compileJava :desktop:compileJava :html:dist --no-daemon

      - name: Verify html output
        run: |
          test -f html/build/dist/index.html
          test -f html/build/dist/html/html.nocache.js

      - uses: actions/upload-artifact@v7
        with:
          name: html-dist
          path: html/build/dist
          if-no-files-found: error
